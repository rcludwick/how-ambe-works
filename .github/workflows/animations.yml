# Render the manim scenes to video.
#
# One job per scene, run in parallel. Rendering is CPU-bound and the scenes are
# independent, so four concurrent jobs finish in roughly the time of the
# slowest one rather than the sum of all four. Each job caches its own scene,
# so editing one scene re-renders only that scene.
#
# RUNNER REQUIREMENTS: manim needs `ffmpeg` plus cairo and pango, installed by
# the apt step below. It does NOT need a TeX distribution: every scene in
# animations/manim/ uses Pango text (`Text`, not `Tex`/`MathTex`), so no LaTeX
# install is required. If a scene ever imports Tex/MathTex that is a bug,
# caught by the check below; rewrite it with Text rather than installing TeX.
#
# The cache and artifact actions here run on Node 24 and need an Actions
# Runner of at least 2.327.1. ubuntu-latest is well past that; the self-hosted
# containers are not automatically, so update them before moving back.
#
# This is a SEPARATE workflow from pages.yml so the render is defined once and
# called where it is needed, rather than duplicated into the deploy.
#
# There is deliberately NO `push` trigger. pages.yml runs on every push to main
# and calls this workflow, so a push trigger here would render the same commit
# twice: two runs, eight jobs, competing for the same pool of runner slots.
# That is what made the render-and-deploy of 93a0786 take 48 minutes when the
# render itself took 28 — the deploy's own render jobs sat queued behind a
# redundant copy of themselves. Docs commits do not pay for this: they reach
# the render through pages.yml and restore from the per-scene cache in seconds.
#
# No `pull_request` either. The repo is public, and if this is ever moved back
# to self-hosted hardware a fork PR could execute arbitrary code there.
name: Animations

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  # github.workflow is included so a render called by pages.yml and a manually
  # dispatched render do not share a group. Without it, cancel-in-progress
  # would let a docs push cancel the render its own deploy is waiting on.
  group: animations-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { file: scene_decomposition.py, class: Decomposition, slug: decomposition }
          - { file: scene_harmonic_sum.py, class: HarmonicSum, slug: harmonic-sum }
          - { file: scene_pipeline.py, class: Pipeline, slug: pipeline }
          - { file: scene_vq.py, class: VectorQuantization, slug: vq }
    steps:
      - uses: actions/checkout@v7

      # Pinned, not 3.x: on 3.13 pip finds no PyAV wheel and falls back to a
      # source build that needs the whole FFmpeg dev toolchain.
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      # Keyed on this scene alone, so editing one scene does not invalidate
      # the other three.
      - name: Restore rendered video
        id: video-cache
        uses: actions/cache@v6
        with:
          path: out
          key: anim-${{ matrix.slug }}-${{ runner.os }}-${{ hashFiles(format('animations/manim/{0}', matrix.file), 'animations/requirements.txt') }}

      - name: Install render dependencies
        if: steps.video-cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            ffmpeg libcairo2-dev libpango1.0-dev pkg-config \
            libavformat-dev libavcodec-dev libavdevice-dev libavutil-dev \
            libavfilter-dev libswscale-dev libswresample-dev

      - name: Install manim
        if: steps.video-cache.outputs.cache-hit != 'true'
        run: |
          python -m pip install --upgrade pip
          if [ -f animations/requirements.txt ]; then
            pip install -r animations/requirements.txt
          else
            pip install manim
          fi

      - name: Check for LaTeX usage
        if: steps.video-cache.outputs.cache-hit != 'true'
        run: |
          if grep -nE '\b(Tex|MathTex|SingleStringMathTex|BulletedList)\b' \
               "animations/manim/${{ matrix.file }}"; then
            echo "::error::Scenes must use Pango Text, not LaTeX. The runner has no TeX install."
            exit 1
          fi

      # MP4 only. H.264 plays in every browser that matters, and manim's WebM
      # path goes through libvpx, which doubles the job for a format nothing
      # here needs.
      - name: Render ${{ matrix.class }}
        if: steps.video-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p out
          manim render \
            --quality m \
            --format mp4 \
            --media_dir media \
            "animations/manim/${{ matrix.file }}" "${{ matrix.class }}"
          # manim names its output after the Scene class; the pages reference a
          # slug. A new scene needs a matrix row above and a poster image in
          # docs/assets/posters/ (tools/make-posters.py).
          found=$(find media/videos -type f -name '${{ matrix.class }}.mp4' | head -1)
          [ -n "$found" ] || { echo "::error::${{ matrix.class }}.mp4 was not produced"; exit 1; }
          cp -f "$found" "out/${{ matrix.slug }}.mp4"

      # Guards the cache-hit path too: a cache that restored empty would
      # otherwise sail through and deploy a dead <video>.
      - name: Verify the file exists
        run: |
          set -euo pipefail
          [ -s "out/${{ matrix.slug }}.mp4" ] \
            || { echo "::error::out/${{ matrix.slug }}.mp4 is missing or empty"; exit 1; }
          ls -lh out

      # One artifact per scene. pages.yml downloads them with a pattern and
      # merges, so adding a scene needs no change there.
      - name: Upload ${{ matrix.slug }}
        uses: actions/upload-artifact@v7
        with:
          name: animations-${{ matrix.slug }}
          path: out/${{ matrix.slug }}.mp4
          if-no-files-found: error
          retention-days: 30
