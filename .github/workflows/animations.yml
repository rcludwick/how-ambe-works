# Render the manim scenes to video.
#
# One job per scene, run in parallel. Rendering is CPU-bound and the scenes are
# independent, so four concurrent jobs finish in roughly the time of the
# slowest one rather than the sum of all four. Each job caches its own scene,
# so editing one scene re-renders only that scene.
#
# RUNNER REQUIREMENTS: manim needs `ffmpeg` plus cairo and pango, installed by
# the apt step below. It does NOT need a TeX distribution: every scene in
# animations/manim/ uses Pango text (`Text`, not `Tex`/`MathTex`), so no LaTeX
# install is required. If a scene ever imports Tex/MathTex that is a bug,
# caught by the check below; rewrite it with Text rather than installing TeX.
#
# The cache and artifact actions here run on Node 24 and need an Actions
# Runner of at least 2.327.1. ubuntu-latest is well past that; the self-hosted
# containers are not automatically, so update them before moving back.
#
# This is a SEPARATE workflow from pages.yml so the render is defined once and
# called where it is needed, rather than duplicated into the deploy.
#
# There is deliberately NO `push` trigger. pages.yml runs on every push to main
# and calls this workflow, so a push trigger here would render the same commit
# twice: two runs, eight jobs, competing for the same pool of runner slots.
# That is what made the render-and-deploy of 93a0786 take 48 minutes when the
# render itself took 28 — the deploy's own render jobs sat queued behind a
# redundant copy of themselves. Docs commits do not pay for this: they reach
# the render through pages.yml and restore from the per-scene cache in seconds.
#
# No `pull_request` either. The repo is public, and if this is ever moved back
# to self-hosted hardware a fork PR could execute arbitrary code there.
name: Animations

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  # github.workflow is included so a render called by pages.yml and a manually
  # dispatched render do not share a group. Without it, cancel-in-progress
  # would let a docs push cancel the render its own deploy is waiting on.
  group: animations-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { file: scene_decomposition.py, class: Decomposition, slug: decomposition }
          - { file: scene_harmonic_sum.py, class: HarmonicSum, slug: harmonic-sum }
          - { file: scene_pipeline.py, class: Pipeline, slug: pipeline }
          - { file: scene_vq.py, class: VectorQuantization, slug: vq }
    steps:
      - uses: actions/checkout@v7

      # uv reads .python-version and pyproject.toml, so the interpreter is
      # pinned in the repository rather than here. That pin matters: PyAV has
      # no wheel above 3.12, and a newer interpreter silently falls back to
      # building FFmpeg bindings from source.
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      # Keyed on this scene alone, so editing one scene does not invalidate
      # the other three. The narration audio is part of the key because a
      # re-recorded line changes both the sound and the scene's timing.
      - name: Restore rendered video
        id: video-cache
        uses: actions/cache@v6
        with:
          path: out
          key: anim-${{ matrix.slug }}-${{ runner.os }}-${{ hashFiles(format('animations/manim/{0}', matrix.file), 'animations/manim/narration.py', format('animations/narration/audio/{0}-*.wav', matrix.slug), 'uv.lock') }}

      # ffmpeg is installed on BOTH paths, unlike everything else here, because
      # the verify step below probes the video with ffprobe and that step runs
      # whether or not the render did. Installing it only on a cache miss made
      # every cache hit fail with "ffprobe: command not found", which the
      # verify step reported as "has no audio track": a broken check reading as
      # a broken video. The runner image does not ship ffmpeg.
      - name: Install ffmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Install render dependencies
        if: steps.video-cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get install -y --no-install-recommends \
            libcairo2-dev libpango1.0-dev pkg-config \
            libavformat-dev libavcodec-dev libavdevice-dev libavutil-dev \
            libavfilter-dev libswscale-dev libswresample-dev

      - name: Install manim
        if: steps.video-cache.outputs.cache-hit != 'true'
        run: uv sync --group animations

      - name: Check for LaTeX usage
        if: steps.video-cache.outputs.cache-hit != 'true'
        run: |
          if grep -nE '\b(Tex|MathTex|SingleStringMathTex|BulletedList)\b' \
               "animations/manim/${{ matrix.file }}"; then
            echo "::error::Scenes must use Pango Text, not LaTeX. The runner has no TeX install."
            exit 1
          fi

      # MP4 only. H.264 plays in every browser that matters, and manim's WebM
      # path goes through libvpx, which doubles the job for a format nothing
      # here needs.
      - name: Render ${{ matrix.class }}
        if: steps.video-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p out
          uv run --group animations manim render \
            --quality m \
            --format mp4 \
            --media_dir media \
            "animations/manim/${{ matrix.file }}" "${{ matrix.class }}"
          # manim names its output after the Scene class; the pages reference a
          # slug. A new scene needs a matrix row above and a poster image in
          # docs/assets/posters/ (tools/make-posters.py).
          found=$(find media/videos -type f -name '${{ matrix.class }}.mp4' | head -1)
          [ -n "$found" ] || { echo "::error::${{ matrix.class }}.mp4 was not produced"; exit 1; }
          cp -f "$found" "out/${{ matrix.slug }}.mp4"

      # Move the moov atom to the front, so a browser can start playing before
      # it has the whole file. manim leaves it after mdat, which means the
      # player must range-request the tail of a ten megabyte file and seek
      # back, and the usual symptom is a clip whose picture runs while its
      # sound does not follow.
      #
      # This runs on BOTH paths, and that is the point. Putting it inside the
      # render step looked right and did nothing: the render is skipped on a
      # cache hit, so the pre-faststart file came straight back out of the
      # cache and shipped unchanged. Anything that has to be true of the
      # artifact belongs here rather than in the render, next to the verify
      # step that checks it.
      #
      # It is a stream copy, so it re-encodes nothing and costs about a
      # second, and it is idempotent: remuxing an already-faststart file is
      # harmless, which is what makes it safe to run every time.
      - name: Put the moov atom first
        run: |
          set -euo pipefail
          src="out/${{ matrix.slug }}.mp4"
          [ -s "$src" ] || { echo "::error::$src is missing before the remux"; exit 1; }
          ffmpeg -v error -y -i "$src" -c copy -movflags +faststart "$src.tmp.mp4"
          mv -f "$src.tmp.mp4" "$src"

      # Guards the cache-hit path too: a cache that restored empty would
      # otherwise sail through and deploy a dead <video>.
      #
      # The caption track is checked just as hard as the video. The scenes
      # carry narration now, so a missing .vtt is a page shipping speech with
      # no text alternative, which is a defect and not a cosmetic one.
      - name: Verify the file exists
        run: |
          set -euo pipefail
          [ -s "out/${{ matrix.slug }}.mp4" ] \
            || { echo "::error::out/${{ matrix.slug }}.mp4 is missing or empty"; exit 1; }
          [ -s "out/${{ matrix.slug }}.vtt" ] \
            || { echo "::error::out/${{ matrix.slug }}.vtt is missing or empty"; exit 1; }
          head -1 "out/${{ matrix.slug }}.vtt" | grep -q '^WEBVTT' \
            || { echo "::error::out/${{ matrix.slug }}.vtt is not a WebVTT file"; exit 1; }
          # Named separately so a missing tool never masquerades as a missing
          # audio track. Without this the two are indistinguishable in the log.
          command -v ffprobe >/dev/null \
            || { echo "::error::ffprobe is not installed, so the video cannot be verified"; exit 1; }
          # Walk the top-level atoms and insist moov precedes mdat. Without
          # this the remux above can be skipped, reordered or quietly undone
          # and nothing would notice: the file still plays locally, where the
          # whole of it is already on disk.
          python3 - "out/${{ matrix.slug }}.mp4" <<'PY'
          import struct, sys
          path = sys.argv[1]
          order, pos, size = [], 0, __import__("os").path.getsize(path)
          with open(path, "rb") as f:
              while pos < size:
                  f.seek(pos)
                  head = f.read(8)
                  if len(head) < 8:
                      break
                  length = struct.unpack(">I", head[:4])[0]
                  order.append(head[4:8].decode("latin1"))
                  if length == 0:
                      break
                  pos += length
          if "moov" not in order or "mdat" not in order:
              sys.exit("::error::%s has no moov/mdat: %s" % (path, " ".join(order)))
          if order.index("moov") > order.index("mdat"):
              sys.exit("::error::%s is not faststart (%s); the remux did not run"
                       % (path, " ".join(order)))
          print("faststart ok: %s" % " ".join(order))
          PY
          ffprobe -v error -select_streams a -show_entries stream=codec_name \
            -of csv=p=0 "out/${{ matrix.slug }}.mp4" | grep -q . \
            || { echo "::error::out/${{ matrix.slug }}.mp4 has no audio track"; exit 1; }
          ls -lh out

      # One artifact per scene. pages.yml downloads them with a pattern and
      # merges, so adding a scene needs no change there.
      - name: Upload ${{ matrix.slug }}
        uses: actions/upload-artifact@v7
        with:
          name: animations-${{ matrix.slug }}
          path: |
            out/${{ matrix.slug }}.mp4
            out/${{ matrix.slug }}.vtt
          if-no-files-found: error
          retention-days: 30
