# Render the manim scenes to video.
#
# RUNNER REQUIREMENTS: manim needs `ffmpeg` plus cairo and pango, installed
# by the apt step below. It does NOT need a TeX distribution: every scene in
# animations/manim/ uses Pango text (`Text`, not `Tex`/`MathTex`), so no LaTeX
# install is required. If a scene ever imports Tex/MathTex that is a bug,
# caught by the check below; rewrite it with Text rather than installing TeX.
#
# This is a SEPARATE workflow from pages.yml so that ordinary docs commits
# never pay for a render. It fires only on manual dispatch or on pushes that
# actually touch animations/**, and the rendered output is cached on the hash
# of the scene sources, so a re-run with unchanged scenes is a cache restore
# rather than a render.
#
# Triggers are deliberately limited: no `pull_request`. This currently runs on
# GitHub-hosted runners, but the repo is public, and if it is ever moved back
# to self-hosted hardware a pull_request trigger would let a fork PR execute
# arbitrary code there. Keep it off.
name: Animations

on:
  push:
    branches: [main]
    paths:
      - "animations/**"
      - ".github/workflows/animations.yml"
  workflow_dispatch:
  # pages.yml calls this so the deploy actually contains the rendered video
  # rather than an artifact nobody downloads. Artifacts uploaded by a called
  # workflow are visible to other jobs in the same run, which is what makes
  # the hand-off work.
  workflow_call:

permissions:
  contents: read

concurrency:
  # github.workflow is included so a render called by pages.yml and a
  # standalone render do not share a group. Without it, cancel-in-progress
  # would let a docs push cancel the render its own deploy is waiting on.
  group: animations-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Pinned, not 3.x: on 3.13 pip finds no PyAV wheel and falls back to a
      # source build that needs the whole FFmpeg dev toolchain.
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      # Restore a previous render keyed on the scene sources. An exact hit
      # means nothing to render; a partial hit still warms manim's own cache.
      - name: Restore rendered video
        id: video-cache
        uses: actions/cache@v4
        with:
          path: docs/assets/video
          key: anim-video-${{ runner.os }}-${{ hashFiles('animations/manim/**/*.py', 'animations/requirements.txt') }}
          restore-keys: |
            anim-video-${{ runner.os }}-

      # manim's partial-movie cache: lets an edited scene re-render only the
      # animations that actually changed.
      - name: Cache manim intermediates
        uses: actions/cache@v4
        with:
          path: media
          key: anim-media-${{ runner.os }}-${{ hashFiles('animations/manim/**/*.py') }}
          restore-keys: |
            anim-media-${{ runner.os }}-

      # ubuntu-latest has ffmpeg but not cairo/pango, which manim renders text
      # with. Still no TeX: the scenes use Pango Text, enforced by the check
      # below.
      - name: Install render dependencies
        if: steps.video-cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            ffmpeg libcairo2-dev libpango1.0-dev pkg-config \
            libavformat-dev libavcodec-dev libavdevice-dev libavutil-dev \
            libavfilter-dev libswscale-dev libswresample-dev

      - name: Install manim
        if: steps.video-cache.outputs.cache-hit != 'true'
        run: |
          python -m pip install --upgrade pip
          if [ -f animations/requirements.txt ]; then
            pip install -r animations/requirements.txt
          else
            pip install manim
          fi

      - name: Check for LaTeX usage
        if: steps.video-cache.outputs.cache-hit != 'true'
        run: |
          if grep -rnE '\b(Tex|MathTex|SingleStringMathTex|BulletedList)\b' animations/manim --include='*.py'; then
            echo "::error::Scenes must use Pango Text, not LaTeX (Tex/MathTex). The runner has no TeX install."
            exit 1
          fi

      - name: Render scenes to WebM and MP4
        if: steps.video-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p docs/assets/video
          shopt -s nullglob
          scenes=(animations/manim/*.py)
          if [ ${#scenes[@]} -eq 0 ]; then
            echo "No scenes to render."
            exit 0
          fi
          for src in "${scenes[@]}"; do
            for fmt in webm mp4; do
              # --write_all renders every Scene in the file. (It is spelled
              # --write_all / -a in manim CE; there is no --all.)
              manim render \
                --quality m \
                --format "$fmt" \
                --media_dir media \
                --write_all \
                "$src"
            done
          done
          # Flatten manim's media/videos/<module>/<res>/ tree into one dir.
          find media/videos -type f \( -name '*.webm' -o -name '*.mp4' \) \
            -exec cp -f {} docs/assets/video/ \;
          # manim names its output after the Scene class; the pages reference
          # a slug. Rename to the slugs the <video> elements in docs/*.md ask
          # for. A new scene needs a line here and a poster image in
          # docs/assets/posters/ (tools/make-posters.py).
          (
            cd docs/assets/video
            for pair in \
              "Decomposition:decomposition" \
              "HarmonicSum:harmonic-sum" \
              "Pipeline:pipeline" \
              "VectorQuantization:vq"
            do
              cls="${pair%%:*}"
              slug="${pair##*:}"
              for ext in webm mp4; do
                if [ -f "$cls.$ext" ]; then mv -f "$cls.$ext" "$slug.$ext"; fi
              done
            done
          )
          ls -lh docs/assets/video

      # Fail loudly if a slug the pages reference has no file. Without this
      # the deploy succeeds and the reader gets a dead <video> element, which
      # is exactly how all four went missing before.
      - name: Verify every referenced slug rendered
        run: |
          set -euo pipefail
          missing=0
          for slug in decomposition harmonic-sum pipeline vq; do
            if [ ! -s "docs/assets/video/$slug.mp4" ]; then
              echo "::error::docs/assets/video/$slug.mp4 is missing or empty"
              missing=1
            fi
          done
          [ "$missing" -eq 0 ]

      - name: Upload rendered animations
        uses: actions/upload-artifact@v4
        with:
          name: animations
          path: docs/assets/video/
          # error, not warn: pages.yml consumes this artifact, and a silent
          # empty upload deploys a site whose four video figures 404.
          if-no-files-found: error
          retention-days: 30
