# Build and deploy the site to GitHub Pages.
#
# Triggers are deliberately limited to `push` on main and manual dispatch.
# Do NOT add a `pull_request` trigger: the repo is public, and if this is ever
# moved back to self-hosted hardware a fork PR could execute code on it.
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # docs/assets/video/ is gitignored build output, so the checkout below has
  # no video in it. Render it here and hand it to the deploy job. The render
  # is cached on the hash of the scene sources, so an ordinary docs commit
  # restores from cache in seconds rather than re-rendering.
  videos:
    uses: ./.github/workflows/animations.yml

  deploy:
    needs: videos
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/configure-pages@v6
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: 3.x

      # Must land before `zensical build`, which copies docs/ into site/.
      # The render is a matrix with one artifact per scene, so this merges
      # them by pattern; adding a scene needs no change here.
      - name: Fetch rendered animations
        uses: actions/download-artifact@v8
        with:
          pattern: animations-*
          merge-multiple: true
          path: docs/assets/video

      - name: Verify the video arrived
        run: |
          set -euo pipefail
          for slug in decomposition harmonic-sum pipeline vq; do
            [ -s "docs/assets/video/$slug.mp4" ] \
              || { echo "::error::docs/assets/video/$slug.mp4 missing before build"; exit 1; }
          done
          ls -lh docs/assets/video

      - run: pip install zensical
      - run: zensical build --clean

      # The whole point of the two jobs above: prove the deployed tree has
      # the video in it, not just the repo.
      - name: Verify the built site carries the video
        run: |
          set -euo pipefail
          for slug in decomposition harmonic-sum pipeline vq; do
            [ -s "site/assets/video/$slug.mp4" ] \
              || { echo "::error::site/assets/video/$slug.mp4 missing after build"; exit 1; }
          done
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - uses: actions/deploy-pages@v5
        id: deployment
